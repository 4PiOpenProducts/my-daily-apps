[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "day2-template"
version = "0.1.0"
description = "Google Colab & uv で即座に再現・実行できるミニアプリ"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
]

[tool.uv]

# Hatchlingがプロジェクト直下の単一ファイル（my_func.py）を認識するための設定
[tool.hatch.build.targets.wheel]
packages = ["my_func.py"]